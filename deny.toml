# cargo-deny-Konfiguration (QA-010): Lizenzen, Advisories, Bans, Quellen.
# Läuft in CI über `cargo deny check`. Ein Ignorieren von Advisories braucht ein Issue
# mit Begründung und Ablaufdatum.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# Nur Lizenzen, die mit Apache-2.0 kompatibel sind. (A/L)GPL ist nicht erlaubt.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
