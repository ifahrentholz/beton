# Latenzmessungen mit Zeitgrenze aus dem AC laufen allein, nicht parallel zum übrigen Testlauf:
# Unter dessen Last dauert ein Workspace-Snapshot über eine Sekunde (#116). Gemessen wird das
# System, die Grenze im Test bleibt unverändert. Unter `cargo test` übernimmt das eine Sperre in
# der Testdatei (`crates/beton-runner/tests/workspace.rs`).
[[profile.default.overrides]]
filter = 'test(/^ses_017_ac3_/)'
threads-required = 'num-test-threads'
