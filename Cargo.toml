[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/ifahrentholz/beton"
authors = ["Ingo Fahrentholz"]

[workspace.dependencies]
# interne Crates
beton-core = { path = "crates/beton-core", version = "0.0.0" }
beton-agents = { path = "crates/beton-agents", version = "0.0.0" }
beton-proto = { path = "crates/beton-proto", version = "0.0.0" }
beton-store = { path = "crates/beton-store", version = "0.0.0" }
beton-server = { path = "crates/beton-server", version = "0.0.0" }
beton-host = { path = "crates/beton-host", version = "0.0.0" }
beton-runner = { path = "crates/beton-runner", version = "0.0.0" }
beton-harness = { path = "crates/beton-harness", version = "0.0.0" }
beton-harness-claude = { path = "crates/beton-harness-claude", version = "0.0.0" }
beton-harness-codex = { path = "crates/beton-harness-codex", version = "0.0.0" }
beton-harness-acp = { path = "crates/beton-harness-acp", version = "0.0.0" }
beton-harness-direct = { path = "crates/beton-harness-direct", version = "0.0.0" }
beton-mcp = { path = "crates/beton-mcp", version = "0.0.0" }
beton-sdk = { path = "crates/beton-sdk", version = "0.0.0" }
beton-cli = { path = "crates/beton-cli", version = "0.0.0" }
beton-git = { path = "crates/beton-git", version = "0.0.0" }
beton-policy = { path = "crates/beton-policy", version = "0.0.0" }
beton-secrets = { path = "crates/beton-secrets", version = "0.0.0" }
beton-proxy = { path = "crates/beton-proxy", version = "0.0.0" }
beton-sandbox = { path = "crates/beton-sandbox", version = "0.0.0" }

# extern
# Secret-Store (SEC-001 … SEC-003): AEAD, KDF und Nullen von Secrets.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hkdf = "0.12"
zeroize = { version = "1.9", features = ["std"] }
# OS-Keychain über das keyring-Ökosystem (SEC-002): keyring-core plus je Plattform ein Store.
keyring-core = "1"
apple-native-keyring-store = { version = "1", features = ["keychain"] }
windows-native-keyring-store = "1"
zbus-secret-service-keyring-store = { version = "1", features = ["rt-async-io-crypto-rust"] }
# Egress-Proxy (PRX-001 … PRX-007): HTTP/1.1 und HTTP/2, TLS über ring (kein aws-lc),
# Zertifikate der beton-CA, IDN-Hosts.
http = "1"
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "server", "server-auto", "tokio"] }
idna = "1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower-service = "0.3"
aho-corasick = "1"
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6"
fastrand = "2"
fs4 = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
hex = "0.4"
http-body-util = "0.1"
# Dateiauswahl mit ripgrep-Semantik (`.gitignore`) für die Workspace-Suche (SES-017).
ignore = "0.4"
# Linux-Sandbox (SBX-008, SBX-009, SBX-013): Landlock, seccomp-BPF, Namespaces und rlimits.
landlock = "0.4.4"
libc = "0.2"
seccompiler = "0.5"
process-wrap = { version = "10", default-features = false, features = ["job-object", "kill-on-drop", "process-group", "tokio1"] }
proptest = "1"
# Prüfung der JUnit-Ausgabe von `beton policy test` (POL-026 AC2), nur in Tests.
roxmltree = "0.21"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rustix = { version = "1", features = ["process"] }
schemars = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_path_to_error = "0.1"
serde_norway = "0.9"
sha2 = "0.10"
subtle = "2"
# Session-Export mit Blobs als `.tar.zst` (DATA-010); ohne xattr, ohne Legacy-Formate.
tar = { version = "0.4", default-features = false }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["catch-panic"] }
# Preis-Katalog (USE-002), eingebettet und beim Start geprüft.
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
ts-rs = { version = "12", features = ["serde-json-impl", "no-serde-warnings"] }
ulid = "3"
# Marked-Event-Parser für Zeilen/Spalten in Agent-YAML (AGT-001); ohne `encoding`.
yaml-rust2 = { version = "0.13", default-features = false }
zstd = { version = "0.13", default-features = false }
utoipa = { version = "6", features = ["preserve_order"] }
utoipa-axum = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# SQLite ist C-Code; unoptimiert verlangsamt es jeden Store-Test deutlich.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# Argon2id mit m = 64 MiB (SEC-003) wäre unoptimiert in Tests sekundenlang.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# AES-GCM und SHA-256 des Datei-Stores; unoptimiert dominieren sie den Kill-Test (SEC-003 AC4).
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.dev]
debug = "line-tables-only"
