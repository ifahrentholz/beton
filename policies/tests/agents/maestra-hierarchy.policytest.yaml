# Policy-Test (POL-026, QA-004): Ein Projekt kann die Agent-Regeln von maestra nicht lockern.
spec_version: 1
layers:
  project: [../fixtures/allow-all.yaml]
  agent: [../../../agents/maestra/agent.yaml]
cases:
  - name: Projekt-allow hebt Agent-deny nicht auf
    phase: tool_call
    input: { tool: { name: Edit, args: { file_path: /repo/a.rs, old_string: a, new_string: b } } }
    expect: { outcome: deny, rules: [maestra-no-code] }
  - name: Projekt-allow hebt Agent-deny für Push nicht auf
    phase: tool_call
    input: { tool: { name: Bash, args: { command: "git push" } } }
    expect: { outcome: deny, rules: [maestra-no-merge] }
