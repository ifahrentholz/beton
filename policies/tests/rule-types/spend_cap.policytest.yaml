# Policy-Test (POL-026 AC4): Regeltyp spend_cap (POL-011).
spec_version: 1
layers: { project: [spend_cap.yaml] }
fixtures:
  run: { cost_usd: 0.0, equivalent_usd: 0.0, subtree_cost_usd: 0.0, subtree_equivalent_usd: 0.0,
         unpriced_models: [], subtree_unpriced_models: [] }
cases:
  - name: Unter der Schwelle ist alles frei
    phase: model_request
    given: { session: { cost_usd: 2.0 } }
    input: { request: { model: claude-opus-4-5, granularity: turn } }
    expect: { outcome: allow }
  - name: Die Schwelle fragt genau einmal
    steps:
      - { cost_delta_usd: 3.1 }
      - { phase: model_request, input: { request: { model: claude-opus-4-5, granularity: turn } },
          expect: { outcome: ask, rules: [session-cap], reason_contains: "3 USD" }, resolve: { decision: allow } }
      - { phase: model_request, input: { request: { model: claude-opus-4-5, granularity: turn } },
          expect: { outcome: allow } }
    expect_state: { session: { "spend_cap/project/budgets/session-cap/asked": 3.0 } }
  - name: Das Limit lehnt vor dem nächsten Turn ab
    phase: model_request
    given: { session: { cost_usd: 5.0 } }
    input: { request: { model: claude-opus-4-5, granularity: turn } }
    expect: { outcome: deny, rules: [session-cap], reason_contains: Kostenlimit }
  - name: Eine Subscription-Session zählt das Listenpreis-Äquivalent
    phase: model_request
    given: { session: { cost_usd: 0.0, equivalent_usd: 5.5 } }
    input: { request: { model: claude-sonnet-4-5, granularity: turn } }
    expect: { outcome: deny, rules: [session-cap] }
  - name: Ein Resume nach dem Limit startet nicht
    phase: session_start
    given: { session: { cost_usd: 6.0 } }
    input: { start: { trigger: resume, harness: claude, model: claude-opus-4-5 } }
    expect: { outcome: deny, rules: [session-cap] }
  - name: Der Teilbaum routet ab 20 USD auf das Fallback-Modell
    phase: model_request
    given: { run: { subtree_cost_usd: 21.0 } }
    input: { request: { model: claude-opus-4-5, granularity: turn } }
    expect: { outcome: allow, rules: [tree-cap], modified: { model: claude-haiku-4-5 } }
