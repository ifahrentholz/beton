<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link auf einen anderen Server</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="link.js"></script>
  </head>
  <body>
    <div class="dialog full" role="dialog" aria-labelledby="link-title">
      <h2 id="link-title">Link auf einen anderen Server</h2>
      <p class="linkline"><code id="link"></code></p>
      <p id="text"></p>
      <p class="hint">beton hat den Link nicht geöffnet und keine Verbindung zu diesem Server aufgebaut.</p>
      <div class="actions">
        <button id="ok">OK</button>
      </div>
    </div>
  </body>
</html>
