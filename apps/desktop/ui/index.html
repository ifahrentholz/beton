<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>beton</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="start.js"></script>
  </head>
  <body>
    <main class="start grain">
      <div class="glyph" aria-hidden="true">b</div>
      <h1 class="wide">beton startet</h1>
      <ul class="steps" id="steps" aria-live="polite"></ul>
      <p class="note muted">Kein Konto, kein Server im Internet. Deine Sessions liegen unter <code id="home">~/.beton/</code>.</p>
    </main>
    <div class="overlay" id="incompatible" role="dialog" aria-modal="true" aria-labelledby="incompatible-title" hidden>
      <div class="dialog">
        <h2 id="incompatible-title">Der laufende Daemon passt nicht zu dieser App</h2>
        <p id="incompatible-text"></p>
        <p class="hint" id="incompatible-hint"></p>
        <div class="actions">
          <button class="primary" id="upgrade"></button>
          <button id="quit">Beenden</button>
        </div>
      </div>
    </div>
  </body>
</html>
