# Preis-Katalog von beton (USE-002): Listenpreise in USD je 1 Mio. Tokens.
#
# Eingebettet per include_str! (beton_core::pricing); Updates kommen ausschließlich mit
# beton-Releases, nie per Netzabruf (ADR-0033). Jede Änderung an Preisen oder Einträgen erhöht
# `catalog_version`; jeder bewertete Usage-Record speichert die verwendete Version, alte Records
# werden nie neu bewertet.
#
# Felder je Modell: `id` (kanonisch), `aliases` (z. B. datierte IDs), `provider`,
# `context_window` (Tokens, wenn der Anbieter es nennt), `input_per_mtok`, `output_per_mtok`,
# `cache_read_per_mtok`, `cache_write_per_mtok` (fehlen sie: 0,1 × bzw. 1,25 × input),
# `valid_from` (ab wann der Preis gilt bzw. Stand der Preisliste des Anbieters).
#
# Quellen (Stand 2026-10-14): platform.claude.com/docs/en/about-claude/pricing und
# …/models/overview (Cache-Write = 5-Minuten-Cache), developers.openai.com/api/docs/pricing
# (Standard-Tier, Kontext ≤ 272k; OpenAI berechnet Cache-Writes wie normale Eingabe).
# Modelle mit gestaffelten Preisen je Kontextlänge (z. B. Claude Haiku 5.5, gpt-5.4, gpt-5.5)
# fehlen bewusst: Der Katalog kennt nur einen Preis je Modell; dafür einen Preis-Override
# anlegen (USE-003).
#
# CI prüft den Katalog (USE-002 AC3): Schema, keine doppelten IDs/Aliase, Preise ≥ 0,
# `valid_from` gesetzt.

catalog_version = "2026-10-14"
currency = "USD"

