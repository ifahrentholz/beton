[package]
name = "beton-runner"
description = "Session-Runtime: führt genau eine Session aus und überwacht den Harness-Prozess."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Testbudget der Policy-Engine (#298, #304): nur als dev-dependency aktivieren, nie in
# ausgelieferten Builds.
test-budget = ["beton-policy/test-budget"]
# Test-Schalter für abgeschaltete Sandbox-Backends (SBX-006 AC1): nur als dev-dependency.
test-sandbox = ["beton-sandbox/test-sandbox"]

[dependencies]
async-trait.workspace = true
beton-agents.workspace = true
beton-core.workspace = true
beton-git.workspace = true
beton-harness.workspace = true
beton-harness-claude.workspace = true
beton-harness-codex.workspace = true
beton-harness-acp.workspace = true
beton-harness-direct.workspace = true
beton-mcp.workspace = true
beton-policy.workspace = true
beton-proto.workspace = true
base64.workspace = true
beton-proxy.workspace = true
beton-sandbox.workspace = true
getrandom.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
zeroize.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
axum.workspace = true
beton-harness-direct = { workspace = true, features = ["mock"] }
beton-host = { workspace = true, features = ["test-budget", "test-sandbox"] }
futures-util.workspace = true
beton-secrets.workspace = true
beton-server.workspace = true
beton-store.workspace = true
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
