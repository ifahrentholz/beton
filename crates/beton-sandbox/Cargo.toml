[package]
name = "beton-sandbox"
description = "Sandbox-Provider-Interface: Registry, deklarative Konfiguration mit fail-closed-Pfadauflösung, Default-Masken, macOS-Backend (Seatbelt), Linux-Backends (Landlock, seccomp, Namespaces, bubblewrap) und Ressourcenlimits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test-Schalter `BETON_TEST_SANDBOX_UNAVAILABLE` (SBX-006 AC1): nur als Dev-Dependency
# aktivieren, nie in ausgelieferten Builds (wie `test-budget`, #304).
test-sandbox = []

[dependencies]
beton-core.workspace = true
getrandom.workspace = true
process-wrap.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_norway.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true

# Launcher für die Tests dieses Crates; im Produkt ist `beton __sandbox-exec` der Launcher.
[[bin]]
name = "beton-sandbox-exec"
path = "src/bin/beton-sandbox-exec.rs"
test = false
doc = false

[dev-dependencies]
base64.workspace = true
beton-proxy = { workspace = true, features = ["test-net"] }
beton-pty.workspace = true
libc = "0.2"
proptest.workspace = true
rcgen.workspace = true
regex.workspace = true
rustls.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-rustls.workspace = true

[lints]
workspace = true
