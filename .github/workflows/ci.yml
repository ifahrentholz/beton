# CI-Gates (QA-010). Jeder Job ist ein Required Check auf `main` (siehe AGENTS.md §6).
name: CI

on:
  pull_request:
    # `labeled`/`unlabeled`: die Label-Checks aus QA-013 (`security-review`, `no-test-needed`)
    # sollen auf Änderungen der Labels reagieren.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    # covers: QA-001 AC3 (jeder Job der PR-Pipeline ist auf 15 min begrenzt)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # covers: QA-010 AC1 (eine neue Clippy-Warnung lässt den PR fehlschlagen)
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  test-linux:
    name: test (linux, ohne Netzwerk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Tests bauen (mit Netzwerk für die Paket-Registry)
        # Doc-Tests lassen sich nicht vorab bauen (`--doc --no-run` gibt es nicht); sie werden
        # offline aus den bereits geladenen Abhängigkeiten kompiliert.
        run: |
          cargo nextest run --workspace --no-run
          cargo fetch
      - name: bubblewrap installieren (SBX-009)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends bubblewrap
          bwrap --version
      - name: Unprivilegierte User-Namespaces erlauben
        # ptrace ohne Yama-Einschränkung wie unter Debian: Die Sandbox darf sich nicht auf Yama
        # verlassen (SBX-008 AC3).
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.yama.ptrace_scope=0
      # covers: QA-001 AC2 (Tests laufen ohne ausgehendes Netz; ein Netzzugriff scheitert)
      - name: Tests ohne Netzwerk (nur Loopback)
        # Die Linux-Escape-Suite läuft für beide Backends; keins darf fehlen (SBX-008, SBX-009).
        env:
          BETON_TEST_LINUX_BACKENDS: landlock,bwrap
        run: |
          unshare --user --map-root-user --net -- sh -euc '
            ip link set lo up
            if curl -sS --max-time 5 https://example.com >/dev/null 2>&1; then
              echo "Netzwerk ist erreichbar, die Isolation greift nicht" >&2
              exit 1
            fi
            cargo nextest run --workspace --offline
            cargo test --workspace --doc --offline
          '
      # Sandbox-Fälle, die Einstellungen des Hosts brauchen; jeder Lauf prüft, dass die
      # Einstellung wirklich galt, statt Fälle zu überspringen. Danach ist alles zurückgesetzt.
      # covers: SBX-008 AC5 (AppArmor-Restriktion: mit Paketprofil nutzbar, ohne Grund und Fallback)
      - name: Sandbox mit AppArmor-Userns-Restriktion und Profil (SBX-008 AC5)
        run: |
          # Kernel, Landlock-ABI und bwrap dieses Runners im Log (QA-005 AC3 folgt mit WP-48).
          uname -r
          target/debug/beton sandbox probe
          launcher="$PWD/target/debug/beton-sandbox-exec"
          sed -e "s#/usr/bin/beton#$launcher#" -e 's#profile beton #profile beton-ci #' \
            deploy/apparmor/beton | sudo tee /etc/apparmor.d/beton-ci >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/beton-ci
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1
          status=0
          BETON_TEST_EXPECT_USERNS_RESTRICTED=1 BETON_TEST_APPARMOR_LAUNCHER="$launcher" \
            cargo nextest run -p beton-sandbox --offline -E 'test(sbx_008_ac5)' || status=$?
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apparmor_parser -R /etc/apparmor.d/beton-ci
          exit $status
      # covers: SBX-009 AC1 (ohne unprivilegierte User-Namespaces wählt auto bwrap; Suite besteht)
      - name: Sandbox ohne User-Namespaces mit setuid-bwrap (SBX-009 AC1)
        run: |
          sudo chmod u+s /usr/bin/bwrap
          sudo sysctl -w kernel.unprivileged_userns_clone=0
          status=0
          BETON_TEST_LINUX_BACKENDS=bwrap BETON_TEST_EXPECT_AUTO=bwrap \
            cargo nextest run -p beton-sandbox --offline \
            -E '(binary(linux) | binary(limits)) & not test(sbx_008_ac5)' || status=$?
          sudo sysctl -w kernel.unprivileged_userns_clone=1
          sudo chmod u-s /usr/bin/bwrap
          exit $status
      # covers: SBX-013 AC3 (Speicherlimit mit cgroup-v2-Delegation, OOM des Tools)
      - name: Sandbox mit delegierter cgroup (SBX-013 AC1, AC3)
        run: |
          cg=/sys/fs/cgroup/beton-ci
          sudo mkdir -p "$cg/tests"
          echo "+memory +pids" | sudo tee "$cg/cgroup.subtree_control" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$cg"
          echo $$ | sudo tee "$cg/tests/cgroup.procs" >/dev/null
          BETON_TEST_EXPECT_CGROUP=1 cargo nextest run -p beton-sandbox --offline -E 'test(sbx_013)'

      # covers: AUTH-001 AC3 (zweiter OS-User kann weder Token-Datei noch Socket öffnen)
      - name: Zweiter OS-User ohne Zugriff
        run: |
          sudo useradd --no-create-home --shell /bin/sh betontest
          BETON_TEST_OTHER_USER=betontest cargo nextest run -p beton-server -E 'test(auth_001_ac3)'

      # covers: DATA-002 AC3 (Durchsatz ≥ 5 000 Events/s, isoliert im Release-Build)
      - name: Benchmark Event-Log-Durchsatz
        run: cargo test -p beton-store --release --lib data_002_ac3 -- --ignored --nocapture

      # covers: DATA-002 AC3 (Durchsatz ≥ 5 000 Events/s, isoliert im Release-Build)
      - name: Benchmark Event-Log-Durchsatz
        run: cargo test -p beton-store --release --lib data_002_ac3 -- --ignored --nocapture

      # covers: POL-002 AC4 (200 Regeln, Phase tool_call, p99 < 2 ms im Release-Build)
      - name: Benchmark Policy-Auswertung
        run: cargo test -p beton-policy --release --test bench -- --ignored --nocapture

      # covers: PRX-001 AC3 (200 parallele HTTPS-Verbindungen, p99-Zusatzlatenz < 20 ms im
      # Release-Build; nur Loopback und lokale Test-Upstreams)
      - name: Benchmark Egress-Proxy
        run: cargo test -p beton-proxy --release --lib prx_001_ac3 -- --ignored --nocapture

      # Coverage-Floor und Ratchet (QA-011) als Schritt dieses Jobs statt eigenem Job: jeder
      # Job muss Required Check sein (QA-010 AC3). Die Basis ist der letzte Stand von main
      # (Actions-Cache, geschrieben von Pushes auf main).
      - name: Coverage-Basis von main laden
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: target/coverage/main.json
          key: coverage-main-${{ github.event.pull_request.base.sha }}
          restore-keys: coverage-main-
      - name: Coverage sicherheitskritischer Crates (QA-011)
        # covers: QA-011 AC1 (beton-policy unter 90 % schlägt fehl)
        # covers: QA-011 AC2 (Bericht je Crate in der Job-Summary)
        # covers: QA-011 AC3 (Ratchet gegen main, Toleranz 0,2 Punkte)
        run: |
          pkgs=""
          for c in beton-policy beton-sandbox beton-proxy beton-secrets; do
            if [ -d "crates/$c" ]; then pkgs="$pkgs -p $c"; fi
          done
          mkdir -p target/coverage
          cargo llvm-cov $pkgs --json --output-path target/coverage/llvm-cov.json
          cargo xtask coverage-gate --input target/coverage/llvm-cov.json \
            --baseline target/coverage/main.json --out target/coverage/current.json \
            --markdown "$GITHUB_STEP_SUMMARY"
      - name: Coverage-Basis für PRs speichern
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp target/coverage/current.json target/coverage/main.json
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/coverage/main.json
          key: coverage-main-${{ github.sha }}

  test-macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # covers: SEC-002 AC1, SEC-002 AC3 (echter Keychain, aber ein temporärer des Runners;
      # Tests berühren nie den Keychain eines Entwicklers, lokal bleiben sie aus)
      - name: Temporären Keychain als Standard anlegen (SEC-002)
        run: |
          KC="$RUNNER_TEMP/beton-test.keychain-db"
          security create-keychain -p beton-ci "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p beton-ci "$KC"
          security list-keychains -d user -s "$KC"
          security default-keychain -d user -s "$KC"
          echo "BETON_TEST_KEYCHAIN=1" >> "$GITHUB_ENV"
          echo "BETON_TEST_KEYCHAIN_PATH=$KC" >> "$GITHUB_ENV"
      - run: cargo nextest run --workspace
      - run: cargo test --workspace --doc
      - name: Temporären Keychain entfernen
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/beton-test.keychain-db" || true

  build-windows:
    name: build (windows, Beta)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # `+1.88` überschreibt rust-toolchain.toml (stable).
      - run: cargo +1.88 check --workspace --all-targets

  spec:
    name: spec + roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask spec-check
      # covers: PROTO-013 AC1, QA-006 AC1 (Feldänderung ohne Neugenerierung lässt die CI fehlschlagen)
      - name: Secret-Scan über Golden-Transcripts
        # covers: QA-003 AC2
        run: cargo xtask golden-scan
      - name: Generierte Schemas und Typen sind aktuell
        # covers: API-004 AC1
        run: cargo xtask codegen --check
      - name: Alle CI-Jobs sind Required Checks auf main
        # covers: QA-010 AC3
        run: python3 scripts/check_branch_protection.py
        env:
          GH_TOKEN: ${{ github.token }}
      # covers: PROTO-013 AC3 (OpenAPI 3.1 mit Linter validiert)
      - name: OpenAPI-Linter
        run: npx --yes @redocly/cli@1 lint openapi/v1.json
      # covers: QA-006 AC2 (Breaking Changes an der OpenAPI nur mit `!`-Commit oder Label)
      - name: OpenAPI-Breaking-Changes gegen den Basis-Branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          BREAKING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change') }}
        run: |
          git fetch --depth=50 origin "$BASE_REF"
          if ! git cat-file -e "origin/$BASE_REF:openapi/v1.json" 2>/dev/null; then
            echo "Basis hat noch keine openapi/v1.json; nichts zu vergleichen."
            exit 0
          fi
          if [ "$BREAKING_LABEL" = "true" ] || git log --format=%s "origin/$BASE_REF..HEAD" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            echo "Breaking Change ist angekündigt (Label oder !-Commit)."
            exit 0
          fi
          mkdir -p /tmp/oas && git show "origin/$BASE_REF:openapi/v1.json" > /tmp/oas/base.json
          cp openapi/v1.json /tmp/oas/head.json
          docker run --rm -v /tmp/oas:/oas tufin/oasdiff:latest breaking /oas/base.json /oas/head.json --fail-on ERR
      - name: Generierte TypeScript-Typen kompilieren
        run: npx --yes -p typescript@5 tsc --noEmit --strict --module esnext --moduleResolution bundler --target es2022 packages/sdk-ts/src/gen/index.ts
      - name: Roadmap ist aktuell
        run: |
          python3 scripts/gen_roadmap.py
          git diff --exit-code docs/spec/roadmap.md
      - name: Spec-Abdeckung M0 (Bericht)
        run: cargo xtask spec-coverage --milestone M0 --report

  commits:
    name: commit-lint + DCO
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Labels und Label-Ereignisse des PRs für `security-tests-touched` (QA-013).
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Commit-Lint und PR-Titel (QA-014)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask commit-lint --range "origin/${BASE_REF}..HEAD" --title "$PR_TITLE"
      - name: DCO (QA-015)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: cargo xtask dco --range "origin/${BASE_REF}..HEAD"
      # Eigener Schritt statt eigenem Job: jeder Job muss Required Check sein (QA-010 AC3).
      - name: security-tests-touched (QA-013)
        # covers: QA-013 AC2 (Code in sicherheitskritischen Crates nur mit Teständerung)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Das Label `no-test-needed` zählt nur, wenn es jetzt am PR hängt und zuletzt von
          # einem Menschen (Actor-Typ `User`, kein Bot/keine App) gesetzt wurde. Labels werden
          # zur Laufzeit gelesen, damit ein Neustart des Jobs ein später gesetztes Label sieht.
          extra=""
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx 'no-test-needed'; then
            actor=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/events" \
              --jq '.[] | select(.event == "labeled" and .label.name == "no-test-needed") | .actor.type' | tail -n1)
            if [ "$actor" = "User" ]; then extra="--no-test-needed"; fi
          fi
          cargo xtask security-tests-touched --range "origin/${BASE_REF}..HEAD" $extra
      - name: security-review-Label (QA-013, ADR-0036)
        # covers: QA-013 AC1 (Übergang bis M3: sicherheitskritische Pfade nur mit Label `security-review`)
        env:
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=""
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx 'security-review'; then
            extra="--has-label"
          fi
          cargo xtask security-review-label --range "origin/${BASE_REF}..HEAD" $extra

  web:
    name: web (Vitest, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Daemon bauen (für die E2E-Tests)
        working-directory: .
        run: cargo build -p beton-cli
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Bundle bauen und prüfen
        # covers: WEB-001 AC4 (keine absoluten http(s)-Asset-URLs im Bundle)
        run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: E2E, M0-Szenario auf drei Engines und Performance-Budgets
        # covers: WEB-015 AC1
        # covers: QA-007 AC1
        run: pnpm e2e
        env:
          CI: "1"
          BETON_BIN: ${{ github.workspace }}/target/debug/beton
      - name: Trace, Screenshot und Daemon-Logs fehlgeschlagener Tests
        # covers: QA-007 AC3
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ergebnisse
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  offline-e2e:
    name: offline-e2e (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, sinkhole]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Daemon und Fake-CLI bauen (vor dem Namespace)
        run: cargo build -p beton-cli -p beton-fake-cli
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Web-UI bauen und Chromium installieren
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y tcpdump
      - name: M0-Demo im Netz-Namespace nur mit Loopback
        # covers: QA-018 AC1
        # covers: QA-018 AC2
        run: scripts/offline-e2e.sh ${{ matrix.mode }}
        env:
          CI: "1"
          BETON_BIN: ${{ github.workspace }}/target/debug/beton
      - name: Mitschnitt und Playwright-Ergebnisse
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-e2e-${{ matrix.mode }}
          path: target/offline-e2e
          retention-days: 7

  sdk-ts:
    name: sdk-ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/sdk-ts
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: packages/sdk-ts/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Paket bauen und in Node importieren (ESM)
        # covers: API-004 AC3
        run: |
          pnpm build
          node -e "import('./dist/index.js').then((m) => { if (!m.BetonClient) process.exit(1) })"

  design:
    name: design-prototyp
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: design/prototype
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: design/prototype/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Feature-Katalog ist aktuell (ADR-0032)
        run: |
          python3 ../../scripts/gen_feature_catalog.py
          git diff --exit-code src/catalog/features.json
      - run: pnpm typecheck
      # Jede Feature-ID der Spec ist einem Screen oder „kein UI“ zugeordnet.
      - run: pnpm test
      - run: pnpm build
